name: image

# Publishes ghcr.io/<owner>/bastion (linux/amd64 + linux/arm64) on every push to main, so a machine without the source can
# `docker compose up` from the published image (docs/admin-guide.md 3.1). Tags: `main` (moves with the branch) and
# `sha-<commit>`. Each architecture builds on a native runner (no QEMU: emulated arm64 took 20 minutes) and a final
# job joins the two digests into one multi-arch tag. Release tags (vX.Y.Z, `latest`, signing, SBOM, chart) stay in release.yml. Pull requests only build.
# The first push creates the package as private: make it public once under the repository's Packages settings, or
# `docker login ghcr.io` with a token that has read:packages on the machine that pulls.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/helm/**"
      - "deploy/kind/**"
      - "deploy/chaos/**"
      - "deploy/upgrade/**"
  pull_request:
    paths:
      - ".github/workflows/image.yml"
      - "deploy/docker/Dockerfile"
      - "deploy/docker/Dockerfile.dockerignore"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PUBLISH: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: image bastion (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bastion
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed by digest only; the merge job gives the digests their tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/bastion,push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH == 'true' }}
          provenance: mode=max
          cache-from: type=gha,scope=bastion-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=bastion-${{ matrix.arch }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: image bastion (manifest)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bastion
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/bastion"
          docker buildx imagetools create             $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")             $(printf "${image}@sha256:%s " *)
      - id: inspect
        name: Resolve the manifest digest
        run: |
          image="${REGISTRY}/${{ github.repository_owner }}/bastion"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r '"digest=" + .digest' >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${image}:sha-${GITHUB_SHA::7}"
      - name: SLSA build provenance (GitHub attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bastion
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true
