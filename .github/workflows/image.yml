name: image

# Publishes ghcr.io/<owner>/bastion (linux/amd64 + linux/arm64) on every push to main, so a machine without the source can
# `docker compose up` from the published image (docs/admin-guide.md 3.1). Tags: `main` (moves with the branch) and
# `sha-<commit>`. Release tags (vX.Y.Z, `latest`, signing, SBOM, chart) stay in release.yml. Pull requests only build.
# The first push creates the package as private: make it public once under the repository's Packages settings, or
# `docker login ghcr.io` with a token that has read:packages on the machine that pulls.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "deploy/helm/**"
      - "deploy/kind/**"
      - "deploy/chaos/**"
      - "deploy/upgrade/**"
  pull_request:
    paths:
      - ".github/workflows/image.yml"
      - "deploy/docker/Dockerfile"
      - "deploy/docker/Dockerfile.dockerignore"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PUBLISH: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read

jobs:
  bastion:
    name: image bastion
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # BuildKit provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bastion
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=bastion
          cache-to: type=gha,mode=max,scope=bastion
      - name: SLSA build provenance (GitHub attestation)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bastion
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
