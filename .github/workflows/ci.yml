name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Lint (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Package boundaries (5.3)
        run: pnpm boundaries
      - name: Unit and integration tests (Docker is available on the runner)
        run: pnpm test:coverage
      - name: Tooling tests
        run: pnpm test:scripts
      - name: MUST coverage (23.5)
        run: pnpm must-coverage
      - name: Load harness tests (standalone deps)
        working-directory: packages/testkit/load
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Load harness tests
        run: pnpm exec vitest run --root packages/testkit/load
