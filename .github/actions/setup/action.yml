name: setup
description: pnpm, Node 24, frozen-lockfile install and the Prisma client. Run actions/checkout first (a local action is only available after the checkout).

inputs:
  generate:
    description: Run `pnpm db:generate` after the install ("false" for jobs that do not build or test code)
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.generate == 'true'
      run: pnpm db:generate
      shell: bash
