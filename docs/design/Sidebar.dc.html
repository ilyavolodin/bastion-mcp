<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["all","admin","manager","member","auditor"],"default":"all"},"active":{"editor":"enum","options":["home","store","servers","activity","plugins","observability","security","catalog","access","settings"],"default":"home"},"hideTags":{"editor":"boolean","default":false},"$preview":{"width":248,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role || 'all';
    const code = { admin: 'a', manager: 'm', member: 'e', auditor: 'u' }[role];
    const can = (r) => role === 'all' || r.indexOf(code) >= 0;
    const active = this.props.active || 'home';
    const keys = ['home', 'store', 'servers', 'activity', 'plugins', 'observability', 'security', 'catalog', 'access', 'settings'];
    const s = {};
    keys.forEach((k) => {
      const on = k === active;
      s[k] = on
        ? { bg: 'linear-gradient(135deg, #ffc23d 0%, #ff8a1f 55%, #ff7a1a 100%)', fg: '#171a3a', sh: '0 8px 20px -6px #ff7a1a8c', ic: '#171a3a' }
        : { bg: 'transparent', fg: '#171a3a', sh: 'none', ic: '#5f6580' };
    });
    const v = {
      observability: can('amu'), security: can('amu'), oversight: can('amu'),
      catalog: can('am'), registry: can('ame'), access: can('am'), settings: can('a'), manage: can('ame')
    };
    const scopes = { all: 'own · team · all', admin: 'all', manager: 'team', member: 'own', auditor: 'all' };
    const labels = { all: 'Preview · all roles', admin: 'Admin', manager: 'Manager · Platform team', member: 'Member', auditor: 'Auditor' };
    return { s, v, yes: true, hideTags: !!this.props.hideTags, activityScope: scopes[role], roleLabel: labels[role] };
  }
}
</script>
