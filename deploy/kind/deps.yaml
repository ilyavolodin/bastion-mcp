# Test-only Postgres 17 and Valkey 8 for the kind suites. Not for production: no persistence, fixed passwords.
apiVersion: v1
kind: Namespace
metadata:
  name: bastion
---
apiVersion: v1
kind: Secret
metadata:
  name: bastion-secrets
  namespace: bastion
type: Opaque
stringData:
  DATABASE_URL: postgres://bastion:bastion@postgres.bastion.svc:5432/bastion
  REDIS_URL: redis://valkey.bastion.svc:6379
  INTERNAL_SECRET: kind-suite-internal-secret-0123456789abcdef0123456789abcdef
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: bastion }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - { name: POSTGRES_USER, value: bastion }
            - { name: POSTGRES_PASSWORD, value: bastion }
            - { name: POSTGRES_DB, value: bastion }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "bastion", "-d", "bastion"] }
            periodSeconds: 3
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: bastion }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: valkey, namespace: bastion }
spec:
  replicas: 1
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: { name: valkey, namespace: bastion }
spec:
  selector: { app: valkey }
  ports: [{ port: 6379 }]
